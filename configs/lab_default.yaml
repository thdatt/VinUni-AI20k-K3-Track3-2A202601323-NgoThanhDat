lab:
  name: multi-agent-research-lab
  max_iterations: 6
  timeout_seconds: 90

agents:
  supervisor:
    policy: deterministic-state-router
  researcher:
    max_sources: 6
  analyst:
    require_evidence_quality_comparison: true
  writer:
    require_citations: true
  critic:
    enabled: true

benchmark:
  queries:
    - "When is a multi-agent architecture justified over a single agent for complex research tasks?"
    - "How should roles be specialized in a multi-agent system without creating excessive coordination overhead?"
    - "How should shared state preserve context and provenance across multi-agent handoffs?"
    - "How do cascading hallucinations propagate through multi-agent pipelines, and how can verification contain them?"
    - "What are the cost, latency, and parallelism trade-offs in multi-agent research systems?"
    - "How should autonomous agent systems defend against prompt injection and tool poisoning?"
